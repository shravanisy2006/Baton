# Database migrations. Baton applies them automatically at start-up (app/db.py: init_db).
# Manual use, from backend/:  alembic upgrade head   |   alembic revision --autogenerate -m "describe change"
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
